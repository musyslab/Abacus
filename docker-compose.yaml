services:
  db:
    image: mysql:9.3
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    ports:
      - '3306:3306'
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      # $$ escapes $ for Compose; the container shell expands MYSQL_USER/MYSQL_PASSWORD itself.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    container_name: backend
    restart: unless-stopped
    build:
      context: backend
    env_file:
      - ./backend/.env.backend
    environment:
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_HOST: "db"
      DB_NAME: ${DB_NAME:?}
      DB_PORT: "3306"
      FLASK_DEBUG: "True"
      TABOT_DIR: "/tabot-files"
    ports:
      - "5000:5000"
    volumes:
      - "./backend:/app"
      - "./tabot-files:/tabot-files"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: frontend
    restart: unless-stopped
    build:
      context: frontend
    environment:
      BROWSER: "none"  
    volumes:
      - "./frontend:/app"
      - "/app/node_modules"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
